# Ordinary CI: does the CONVERGE client build and pass its tests, on every operating system it
# claims to support?
#
# The point of the matrix is that nothing here is inferred from Linux. The Windows job is the
# only thing that has ever compiled platform.hpp's Windows branch, and the only thing that
# checks the owner-only ACL on private state is really applied; the macOS job compiles and runs
# on real macOS rather than trusting that a POSIX build implies one.
#
# Nothing in this workflow needs a secret. A pull request from a fork runs the whole thing.
name: CI

on:
  push:
    branches: [master, main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-x86_64
            os: ubuntu-latest
          - name: windows-x86_64
            os: windows-latest
          - name: macos-arm64
            os: macos-14          # Apple silicon runner
          - name: macos-x86_64
            os: macos-13          # Intel runner
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # Boost headers and OpenSSL 3. Only the headers of Boost are needed: the bridge links
      # Boost::headers and nothing compiled.
      - name: Dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake g++ libboost-dev libssl-dev

      - name: Dependencies (macOS)
        if: runner.os == 'macOS'
        # Homebrew's openssl goes on PATH ahead of the system one. macOS ships LibreSSL under
        # the name `openssl`, and it cannot sign Ed25519 the way a release is signed (`-rawin`),
        # so without this the updater tests would skip their signature round trip here.
        run: |
          brew install boost openssl@3 cmake
          echo "$(brew --prefix openssl@3)/bin" >> "$GITHUB_PATH"

      - name: Dependencies (Windows)
        if: runner.os == 'Windows'
        run: |
          vcpkg install boost-asio:x64-windows boost-beast:x64-windows boost-json:x64-windows openssl:x64-windows
        shell: pwsh

      - name: Configure
        run: >
          cmake -S bridge -B bridge/build -DCMAKE_BUILD_TYPE=Release
          ${{ runner.os == 'Windows' && '-DCMAKE_TOOLCHAIN_FILE=C:/vcpkg/scripts/buildsystems/vcpkg.cmake' || '' }}
          ${{ runner.os == 'macOS' && '-DOPENSSL_ROOT_DIR="$(brew --prefix openssl@3)"' || '' }}

      - name: Build
        run: cmake --build bridge/build --config Release -j

      # crypto, platform and session interaction. On Windows `platform` is the test that proves
      # the ACL, so a failure here is a real finding and not a CI quirk.
      - name: Bridge tests
        run: ctest --test-dir bridge/build --build-config Release --output-on-failure

      - name: Locate the binary
        id: binary
        shell: bash
        run: |
          for candidate in bridge/build/converge-bridge bridge/build/Release/converge-bridge.exe \
                           bridge/build/converge-bridge.exe; do
            if [ -f "$candidate" ]; then echo "path=$candidate" >> "$GITHUB_OUTPUT"; exit 0; fi
          done
          echo "no converge-bridge was produced" >&2
          exit 1

      # What each host sees when CONVERGE is invoked: banner, version, menu, tool schema.
      - name: Host check
        shell: bash
        run: python3 scripts/host-check.py "${{ steps.binary.outputs.path }}"

      # Paths, locks, replacing a file that is in use, the live-hook paths, test isolation.
      - name: Platform tests
        shell: bash
        run: python3 scripts/platform-test.py "${{ steps.binary.outputs.path }}"

      # The updater against a throwaway local release: signatures, digests, atomicity, failure.
      - name: Updater tests
        shell: bash
        run: python3 scripts/skill-update-test.py

      # VERSION, the packaged skill and the built binary must all state the same thing.
      - name: Version consistency
        shell: bash
        run: python3 scripts/version-check.py "${{ steps.binary.outputs.path }}"

      # The installer is a POSIX shell script; parse it where there is a shell to parse it with.
      - name: Installer syntax
        if: runner.os != 'Windows'
        run: sh -n agent/install.sh

  publication-safety:
    name: publication safety
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      # This repository is world readable, so the question is asked on every change rather than
      # when somebody remembers: credentials, developer paths, private infrastructure, build
      # artifacts. It reads the working tree, not only what is committed.
      - run: python3 scripts/safety-check.py

  packaging:
    name: packaging
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: sudo apt-get update && sudo apt-get install -y cmake g++ libboost-dev libssl-dev
      # Build a release directory and its manifest, so that a mistake in the release tooling is
      # found on an ordinary change rather than on the day of a release. Nothing is published.
      - run: make dist
      - name: Show the manifest
        run: cat dist/manifest.json && cat dist/SHA256SUMS
