# Builds and drafts a CONVERGE client release.
#
# It runs only for a tag, and a tag is a deliberate act by a person. It never runs for a pull
# request.
#
# What it does: builds converge-bridge on each of the four supported platforms and runs the
# tests on each, collects those binaries with the skill, the renderer, the updater, the
# installer and a source tarball, writes manifest.json and SHA256SUMS over exactly those bytes,
# and creates a DRAFT release with the unsigned artifacts attached.
#
# What it deliberately does not do: sign anything. The release-signing key is held by the
# project owner, offline. It is not in this repository, not in GitHub Actions, not in a
# repository secret, and not on any machine that serves releases, and nothing in this workflow
# asks for it or could use it. The owner takes manifest.json out of the draft, checks it says
# what this tag and this commit should say, signs those exact bytes with
# scripts/sign-manifest.py on their own machine, uploads manifest.json.sig, and publishes.
# A release that leaves this workflow is a draft that nobody has vouched for yet, and it stays
# that way until a person does. docs/RELEASE.md is the procedure.
#
# It also refuses to touch a release that is already published. A published release has been
# read and signed by the owner, and its bytes are what every installation checks against, so
# nothing automatic may write to it: scripts/release-guard.py asks before the builds and again
# before the upload, and refuses when it cannot get an answer.
name: Release

on:
  push:
    tags: ['v*.*.*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to build, for a dry run that publishes nothing'
        required: true

permissions:
  contents: write

jobs:
  # Asked before anything is built, because a tree that should not be published is not worth
  # four platform builds first.
  safety:
    name: publication safety
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - run: python3 scripts/safety-check.py
      - run: python3 scripts/text-check.py
      - run: python3 scripts/version-check.py
      - run: python3 scripts/release-test.py
      # Asked before anything is built: a tag whose release is already published cannot be
      # rebuilt here, because the owner signed those exact bytes and automation does not
      # overwrite them. This is what a moved tag hit on 2026-09-20.
      - name: Refuse to touch an already-published release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: python3 scripts/release-guard.py --tag "${{ github.ref_name }}"
      - name: The tag and VERSION must agree
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          version="$(tr -d '[:space:]' < VERSION)"
          [ "${{ github.ref_name }}" = "v$version" ] || {
            echo "tag ${{ github.ref_name }} does not match VERSION $version" >&2; exit 1; }

  bridge:
    name: bridge ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    needs: safety
    strategy:
      fail-fast: true            # a release with one platform missing is not a release
      matrix:
        include:
          - { name: linux-x86_64,   os: ubuntu-22.04 }
          - { name: windows-x86_64, os: windows-latest }
          - { name: macos-arm64,    os: macos-14 }
          - { name: macos-x86_64,   os: macos-15-intel }   # macos-13 is retired
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }

      # Linux is built in an Alpine container against musl, fully static: the published file
      # depends on no glibc version and no OpenSSL on the machine that runs it. The recipe is
      # scripts/build-static-linux.sh, the same one a developer runs; docker is on the runner.
      # The Python steps below run on the runner, not in the container.
      - name: Build (Linux, static, in a container)
        if: runner.os == 'Linux'
        run: |
          scripts/build-static-linux.sh x86_64
          mkdir -p bridge/build && cp bridge/build-static-x86_64/converge-bridge bridge/build/converge-bridge

      # macOS links OpenSSL as static archives built here from the pinned source release, so the
      # published file needs no Homebrew and no OpenSSL on the machine that runs it. Homebrew's
      # openssl stays on PATH for the tests' `openssl` command line (macOS ships LibreSSL under
      # that name, which cannot sign Ed25519 the way a release is signed).
      - name: Dependencies (macOS)
        if: runner.os == 'macOS'
        run: |
          brew install boost openssl@3 cmake
          echo "$(brew --prefix openssl@3)/bin" >> "$GITHUB_PATH"
          scripts/build-static-openssl.sh "$HOME/openssl-static"
          echo "OPENSSL_STATIC=$HOME/openssl-static" >> "$GITHUB_ENV"

      - name: Dependencies (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        # The static triplet: OpenSSL as .lib archives and the MSVC runtime linked in (/MT), so
        # the published .exe carries no DLL beside it.
        run: vcpkg install boost-asio:x64-windows-static boost-beast:x64-windows-static boost-json:x64-windows-static openssl:x64-windows-static

      - name: Configure
        if: runner.os != 'Linux'
        run: >
          cmake -S bridge -B bridge/build -DCMAKE_BUILD_TYPE=Release -DCONVERGE_BRIDGE_FULLY_STATIC=ON
          ${{ runner.os == 'Windows' && '-DCMAKE_TOOLCHAIN_FILE=C:/vcpkg/scripts/buildsystems/vcpkg.cmake -DVCPKG_TARGET_TRIPLET=x64-windows-static' || '' }}
          ${{ runner.os == 'macOS' && '-DOPENSSL_ROOT_DIR="$OPENSSL_STATIC"' || '' }}

      - name: Build
        if: runner.os != 'Linux'
        run: cmake --build bridge/build --config Release -j

      # A release artifact that fails its own tests is not shipped. This is the same suite CI
      # runs on an ordinary push, on the machine the artifact was built on. (The Linux container
      # build ran its tests inside the container.)
      - name: Bridge tests
        if: runner.os != 'Linux'
        run: ctest --test-dir bridge/build --build-config Release --output-on-failure

      - name: Name and stage the binary
        id: stage
        shell: bash
        run: |
          version="$(tr -d '[:space:]' < VERSION)"
          suffix=""
          built="bridge/build/converge-bridge"
          if [ "${{ runner.os }}" = "Windows" ]; then
            suffix=".exe"
            built="bridge/build/Release/converge-bridge.exe"
            [ -f "$built" ] || built="bridge/build/converge-bridge.exe"
          fi
          name="converge-bridge-$version-${{ matrix.name }}$suffix"
          mkdir -p staged
          cp "$built" "staged/$name"
          python3 scripts/version-check.py "staged/$name"
          # Self contained, or not shipped: nothing loaded at run time but the operating system.
          python3 scripts/check-static.py "staged/$name"

      - name: Host, platform, transport and updater tests
        shell: bash
        run: |
          python3 scripts/host-check.py "staged/converge-bridge-$(tr -d '[:space:]' < VERSION)-${{ matrix.name }}${{ runner.os == 'Windows' && '.exe' || '' }}"
          python3 scripts/platform-test.py "staged/converge-bridge-$(tr -d '[:space:]' < VERSION)-${{ matrix.name }}${{ runner.os == 'Windows' && '.exe' || '' }}"
          python3 scripts/transport-test.py "staged/converge-bridge-$(tr -d '[:space:]' < VERSION)-${{ matrix.name }}${{ runner.os == 'Windows' && '.exe' || '' }}"
          python3 scripts/skill-update-test.py

      - uses: actions/upload-artifact@v4
        with:
          name: bridge-${{ matrix.name }}
          path: staged/*
          if-no-files-found: error

  package:
    name: manifest and draft
    runs-on: ubuntu-latest
    needs: bridge
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }

      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          pattern: bridge-*
          merge-multiple: true

      - name: Assemble the release directory
        run: |
          version="$(tr -d '[:space:]' < VERSION)"
          mkdir -p dist
          cp artifacts/* dist/
          cp agent/skill.md agent/converge-live.py agent/converge-update.py agent/install.sh dist/
          git archive --format=tar.gz --prefix="converge-$version/" -o dist/converge-src.tar.gz HEAD
          ls -la dist

      # --complete is the part that cannot silently omit a platform: it refuses a release
      # directory missing any of the four binaries, carrying a file the release does not
      # publish, or naming a platform twice. It also refuses an incoherent release: every
      # artifact must state the same version, and every binary must be the executable format
      # its name claims, for the operating system and architecture it is filed under.
      - name: Manifest and checksums
        run: |
          python3 scripts/release-manifest.py dist --complete \
            --tag "${{ github.event.inputs.tag || github.ref_name }}" \
            --commit "${{ github.sha }}"

      - name: Verify what is about to be attached
        working-directory: dist
        run: sha256sum -c SHA256SUMS

      - name: Show the manifest
        run: cat dist/manifest.json

      # A draft, never a publication. softprops/action-gh-release does not publish a draft, and
      # there is no later step here that would: the release becomes public when the owner has
      # signed the manifest, uploaded manifest.json.sig, and pressed publish themselves.
      # Asked again here, not only in `safety`: four platform builds separate the two, and the
      # answer is only worth anything as of the moment before the upload.
      - name: Refuse to touch an already-published release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: python3 scripts/release-guard.py --tag "${{ github.ref_name }}"

      - name: Draft the release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          files: dist/*
          generate_release_notes: true
          body: |
            CONVERGE client ${{ github.ref_name }}, Free Software under GPLv3.

            Built from `${{ github.sha }}` by
            [this run](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}).

            Every artifact's SHA-256 and byte size is in `manifest.json`, and `SHA256SUMS`
            covers the release as a whole.

            Verify a download:

                sha256sum -c SHA256SUMS

            Authenticity: `manifest.json.sig` is a detached Ed25519 signature over the exact
            bytes of `manifest.json`, made offline by the project owner with a key that is not
            in this repository, not in CI and not on any machine that serves releases. The
            public half and its fingerprint are in [SECURITY.md](../blob/master/SECURITY.md).

                openssl pkeyutl -verify -pubin -inkey converge-release.pub -rawin \
                    -in manifest.json -sigfile manifest.json.sig

            Install: https://github.com/converge-pairwork/converge#installation
